name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds every package, including compiling the mesher to WebAssembly
      # with AssemblyScript. The client's build type-checks it before Vite
      # bundles it, so a client type error fails this step.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
